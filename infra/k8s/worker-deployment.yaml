apiVersion: apps/v1
kind: Deployment
metadata:
  name: attt-worker
  namespace: attt
  labels:
    app: attt-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attt-worker
  template:
    metadata:
      labels:
        app: attt-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: attt-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.core.celery_app.celery
            - worker
            - --loglevel=info
            - --queues=scans,ai,rag,exploit,default
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: attt-config
            - secretRef:
                name: attt-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery_app.celery
                - inspect
                - ping
                - -d
                - "celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attt-worker-hpa
  namespace: attt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attt-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
