apiVersion: apps/v1
kind: Deployment
metadata:
  name: attt-api
  namespace: attt
  labels:
    app: attt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attt-api
  template:
    metadata:
      labels:
        app: attt-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: attt-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ["/app/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: attt-config
            - secretRef:
                name: attt-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: attt-api
  namespace: attt
spec:
  selector:
    app: attt-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
